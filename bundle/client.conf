# chaossync-client — дефолтный конфиг (этап Э5).
# Формат: key value  ИЛИ  key=value. Строки с # — комментарии.
# Приоритет: дефолт < этот файл < командная строка.
# Секретный ключ сюда НЕ кладём путём в открытом виде — только путь к файлу 0600.

# Адрес ноды host:port (ОБЯЗАТЕЛЬНО поменять под свою ноду)
node 192.0.2.10:4500

# Путь к файлу мастер-ключа (base64(32B), 0600). Ключ — только файлом.
keyfile chaossync.key

# Параметры звена (должны совпадать на ноде и клиенте)
T 8
c 0.85
rate 1000
S 32
batch 4

# Тестовый кадр после синхронизма (пусто = не слать)
send ping

# Ограничения прогона
dur 60s
sync-timeout 30s
