name: antidpi-verify
on:
  push:
    paths:
      - 'research/antidpi-sim8/**'
      - 'protocol/reference_parser.py'
      - 'internal/chaossync/**'
      - 'internal/chameleon/**'
      - 'scripts/antidpi-verify.sh'
      - '.github/workflows/antidpi-verify.yml'
  workflow_dispatch:

jobs:
  python-battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Анти-DPI регрессия (sim8 sweep, parser, fixtures, invariants, test inventory)
        run: ./scripts/antidpi-verify.sh

  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true
      - name: chaossync + chameleon unit tests
        run: go test ./internal/chaossync ./internal/chameleon -count=1
      - name: Vet
        run: go vet ./internal/chaossync ./internal/chameleon
